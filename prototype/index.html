<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>K — Hangul Learning App</title>
  <meta name="description" content="Hangul learning app for Korean heritage children — Phase 1 prototype" />

  <!-- Korean font — Noto Sans KR via Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css?v=8" />
</head>
<body>

<div class="app-shell">

  <!-- ═══ HEADER ═══════════════════════════════════════════════════════ -->
  <!--
    Persistent on every screen.
    House icon = Child Mode. Lock icon = Parent Mode.
    Date shown in English and Korean on every screen — bilingual presence is intentional.
    TODO: Human decision needed — final mode button labels (Parent/Child, Mum/Children, etc.)
  -->
  <header class="app-header" role="banner">

    <div class="app-title-group">
      <span class="mode-icon" id="mode-icon" aria-hidden="true">🏠</span>
      <span class="app-title">K</span>
      <div class="date-group">
        <span class="date-english" id="date-english"></span>
        <span class="date-korean" id="date-korean"></span>
      </div>
      <button
        class="calendar-trigger"
        onclick="toggleCalendar()"
        aria-label="Open calendar to select a date"
        aria-expanded="false"
        id="calendar-btn">
        📅
      </button>
    </div>

    <!-- Audio playing indicator — always in DOM, shown via .visible class -->
    <div class="audio-indicator" id="audio-indicator" role="status" aria-live="polite" aria-label="Playing Korean audio">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>

    <!-- Mode toggle -->
    <nav class="mode-toggle" role="navigation" aria-label="Switch mode">
      <button
        class="btn-mode"
        id="btn-child-mode"
        onclick="switchMode('child')"
        aria-label="Switch to Child Mode">
        Children
      </button>
      <button
        class="btn-mode"
        id="btn-parent-mode"
        onclick="switchMode('parent')"
        aria-label="Switch to Parent Mode">
        Parent
      </button>
    </nav>

    <button class="btn-reset" onclick="resetPrototype()" title="Reset all tasks and state for prototype testing">↺ Reset</button>

  </header>

  <!-- ═══ CALENDAR PANEL ═══════════════════════════════════════════════ -->
  <!--
    Toggled by the calendar icon in the header.
    Shows a 14-day date grid (two rows of 7 — from the sketch).
    TODO: Human decision needed — should day-of-week labels appear above each column?
    TODO: Human decision needed — should the calendar show 7 or 14 days?
  -->
  <div class="calendar-panel hidden" id="calendar-panel" role="region" aria-label="Date selector">
    <div class="calendar-grid" id="calendar-grid">
      <!-- Generated by script.js renderCalendar() -->
    </div>
  </div>

  <!-- ═══ MAIN CONTENT ═════════════════════════════════════════════════ -->
  <main class="main-content" role="main">

    <!-- ─── PARENT SCREEN ─────────────────────────────────────────── -->
    <!--
      Parent Mode: task list for the selected date, + button to add tasks.
      Three-panel layout on tablet landscape.
      Lock icon in header when this screen is active.
    -->
    <div id="screen-parent" class="hidden">

      <!-- Date strip — 7-day picker. Tapping changes the date without navigating away. -->
      <div class="date-strip" id="date-strip" role="navigation" aria-label="Select a date">
        <!-- Rendered by renderDateStrip() -->
      </div>

      <div class="three-panel">

        <!-- Column 1: To-do — English task names for the selected date -->
        <section class="panel" aria-label="To-do tasks">
          <div class="panel-header">
            <h2 class="panel-title">To do</h2>
            <button class="panel-add-btn" onclick="openAddTask()" aria-label="Add a new task">
              + Task
            </button>
          </div>
          <p class="panel-hint">Tap a task to link it to a Hangul word and image.</p>
          <div id="parent-task-list" role="list" aria-label="Task list">
            <!-- Rendered by renderTasksColumn() -->
          </div>
        </section>

        <!-- Column 2: Hangul library — tap a word to link it to the selected task -->
        <section class="panel" aria-label="Hangul words">
          <div class="panel-header">
            <h2 class="panel-title">한글 Hangul</h2>
            <button class="panel-add-btn" onclick="openInlineHangul()" aria-label="Create a new Hangul card">
              + Card
            </button>
          </div>
          <div id="hangul-library-list" role="list" aria-label="Hangul card library">
            <!-- Rendered by renderHangulColumn() -->
          </div>
        </section>

        <!-- Column 3: Image pool — tap an image to link it to the selected task -->
        <section class="panel" aria-label="Images">
          <div class="panel-header">
            <h2 class="panel-title">Images</h2>
          </div>
          <!-- Local search — filters the fixed visual pool only, no external API -->
          <input
            type="text"
            id="image-search-input"
            class="image-search-bar"
            placeholder="Search, e.g. food, sleep, tooth"
            oninput="onImageSearch(this.value)"
            aria-label="Search the image library" />
          <div class="image-pool-grid" id="image-pool-grid" role="list" aria-label="Image library">
            <!-- Rendered by renderImageColumn() -->
          </div>
        </section>

      </div>
    </div>

    <!-- ─── CHILD SCREEN ──────────────────────────────────────────── -->
    <!--
      Child Mode: today's routine in time order, Hangul cards to match.
      Three-panel layout on tablet landscape.
      House icon in header when this screen is active.

      Interaction:
        1. Child taps a task slot → task is highlighted → Korean audio plays
        2. Child taps a Hangul card → correct or incorrect feedback
        3. All tasks done → completion panel appears → reward unlocks

      Korean text on cards: Korean only. No English, no romanisation.
    -->
    <div id="screen-child">
      <div class="three-panel">

        <!-- Panel 1: Daily routine task list -->
        <section class="panel" aria-label="Today's routine">
          <div class="panel-title">오늘의 할 일 To do</div>
          <div id="child-task-list" role="list" aria-label="Daily routine tasks">
            <!-- Rendered by renderChildTaskList() -->
          </div>
        </section>

        <!-- Panel 2: Hangul card matching -->
        <section class="panel" aria-label="Hangul cards">
          <div class="panel-title">한글 Hangul</div>
          <p style="font-size:12px; color: var(--colour-text-muted); margin-bottom: 8px;">
            Tap a task, then tap the matching Korean word.
          </p>

          <!-- Feedback — correct or incorrect match message -->
          <div id="feedback-area" class="feedback-area" role="status" aria-live="polite"></div>

          <!-- Hangul card grid — two columns, Korean text only -->
          <div class="hangul-card-grid" id="hangul-card-grid" role="list" aria-label="Hangul word cards">
            <!-- Rendered by renderHangulCardGrid() -->
          </div>
        </section>

        <!-- Panel 3: Completion and reward -->
        <!--
          Hidden until all tasks are matched.
          TODO: Human decision needed — should the completion panel
          always occupy the third column (three panels visible simultaneously),
          or only appear after all tasks are complete?
          This is the key unresolved interaction design question from visual-reference.md §10.
        -->
        <!-- Panel 3: Reward progress — always visible; content rendered by renderCompletionPanel() -->
        <section class="panel" id="completion-panel" aria-label="Reward progress">
          <!-- Rendered by renderCompletionPanel() -->
        </section>

      </div>
    </div>

  </main>

  <!-- Popup removed — task and Hangul creation now use inline forms in each column -->

  <!-- ═══ SAVE CONFIRMATION TOAST ══════════════════════════════════════ -->
  <div class="save-toast" id="save-toast" role="status" aria-live="polite">
    ✓ Task saved
  </div>

  <!-- ═══ FOOTER ═══════════════════════════════════════════════════════ -->
  <!--
    Attribution is required for open-source visual assets.
    Emoji fallbacks in this prototype use system emoji (no attribution needed).
    If switching to OpenMoji or Noto Emoji icon files, update the attribution below.
  -->
  <footer class="app-footer" role="contentinfo">
    <p class="attribution">
      K — Hangul Learning App · Phase 1 Prototype ·
      <!-- TODO: Add OpenMoji or Noto Emoji attribution here when icon library is chosen -->
      Emoji via system fonts · Korean font: Noto Sans KR (Google Fonts, OFL)
    </p>
  </footer>

</div><!-- .app-shell -->

<script src="script.js?v=8"></script>

<script>
  // ─── CALENDAR RENDER ────────────────────────────────────────────────
  // Renders a 14-day calendar grid starting from today.
  // Placed inline here so it has access to the DOM immediately after script.js loads.

  function renderCalendar() {
    const grid = document.getElementById('calendar-grid');
    if (!grid) return;

    const today = new Date();
    const dayLabels = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

    let html = dayLabels.map(d =>
      `<div class="calendar-day-label">${d}</div>`
    ).join('');

    // Start from Monday of the current week
    const startDate = new Date(today);
    const dayOfWeek = today.getDay(); // 0=Sun
    const mondayOffset = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
    startDate.setDate(today.getDate() + mondayOffset);

    for (let i = 0; i < 14; i++) {
      const d = new Date(startDate);
      d.setDate(startDate.getDate() + i);
      const isToday = d.toDateString() === today.toDateString();
      html += `
        <div
          class="calendar-date-cell ${isToday ? 'today' : ''}"
          role="button"
          tabindex="0"
          aria-label="${d.toDateString()}${isToday ? ' — today' : ''}"
          onclick="selectCalendarDate('${d.toISOString().slice(0,10)}')">
          ${d.getDate()}
        </div>`;
    }

    grid.innerHTML = html;
  }

  function selectCalendarDate(dateStr) {
    // Phase 1: selecting a different date just closes the calendar.
    // Full multi-date routine scheduling is Phase 2+.
    // TODO: Human decision needed — should selecting a past/future date load a different task list?
    state.calendarOpen = false;
    render();
    renderCalendar();
  }

  // Re-render the calendar whenever it is opened
  const _origToggleCalendar = toggleCalendar;
  window.toggleCalendar = function() {
    _origToggleCalendar();
    renderCalendar();
    // Update aria-expanded on the calendar button
    const btn = document.getElementById('calendar-btn');
    if (btn) btn.setAttribute('aria-expanded', state.calendarOpen);
  };

  // ─── INCORRECT CARD SHAKE ────────────────────────────────────────────
  // Add a gentle shake to the wrong card on incorrect match.
  // Overrides attemptMatch to add the animation class.

  const _origAttemptMatch = attemptMatch;
  window.attemptMatch = function(cardId) {
    const wasIncorrect = state.matchResult === 'incorrect';
    _origAttemptMatch(cardId);
    if (state.matchResult === 'incorrect') {
      // Find the card button and shake it
      setTimeout(() => {
        document.querySelectorAll('.hangul-card').forEach(btn => {
          if (btn.querySelector('.hangul-text')?.textContent ===
              HANGUL_LIBRARY.find(c => c.id === cardId)?.hangul) {
            btn.classList.add('shake');
            setTimeout(() => btn.classList.remove('shake'), 400);
          }
        });
      }, 0);
    }
  };
</script>

</body>
</html>
